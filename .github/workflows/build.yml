
name: TQsignal V2 APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build V2 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Check build environment
        run: |
          java -version
          flutter --version

      - name: Create Flutter project
        run: |
          flutter create \
            --org com.jcapps \
            --project-name tqsignal \
            app

          rm -rf app/lib
          cp -R template/lib app/lib
          cp template/pubspec.yaml app/pubspec.yaml

          mkdir -p app/android/app/src/main

          cp \
            template/android/app/src/main/AndroidManifest.xml \
            app/android/app/src/main/AndroidManifest.xml

      - name: Configure V2 package and app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("app/android/app")
          gradle = android / "build.gradle"
          gradle_kts = android / "build.gradle.kts"

          package_id = "com.jcapps.tqsignal.v2"

          if gradle.exists():
              content = gradle.read_text()

              content = re.sub(
                  r'applicationId\s+"[^"]+"',
                  f'applicationId "{package_id}"',
                  content
              )

              gradle.write_text(content)

          elif gradle_kts.exists():
              content = gradle_kts.read_text()

              content = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{package_id}"',
                  content
              )

              gradle_kts.write_text(content)

          else:
              raise SystemExit(
                  "Android Gradle file not found"
              )

          manifest = (
              android /
              "src/main/AndroidManifest.xml"
          )

          content = manifest.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="TQsignal V2"',
              content
          )

          manifest.write_text(content)

          print("V2 package:", package_id)
          print("V2 app name: TQsignal V2")
          PY

      - name: Install Flutter dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Upload V2 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TQsignal-V2-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
