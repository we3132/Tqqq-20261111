
name: TQsignal V2 Separate APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build V2 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        shell: bash
        run: |
          set -euo pipefail

          test -f template/lib/main.dart
          test -f template/pubspec.yaml

          rm -rf app

          flutter create \
            --org com.jcapps.tqsignal \
            --project-name v2 \
            --platforms android \
            app

          rm -rf app/lib
          cp -R template/lib app/lib
          cp template/pubspec.yaml app/pubspec.yaml

          if [ -f template/android/app/src/main/AndroidManifest.xml ]; then
            cp \
              template/android/app/src/main/AndroidManifest.xml \
              app/android/app/src/main/AndroidManifest.xml
          fi

      - name: Configure separate V2 app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/android/app")
          expected = "com.jcapps.tqsignal.v2"

          kts = root / "build.gradle.kts"
          groovy = root / "build.gradle"

          if kts.exists():
              path = kts
              content = path.read_text()

              pattern = r'(?m)^(\s*)applicationId\s*=\s*[^\r\n]+'
              replacement = (
                  r'\g<1>applicationId = "'
                  + expected + '"'
              )

          elif groovy.exists():
              path = groovy
              content = path.read_text()

              pattern = r'(?m)^(\s*)applicationId\s+[^\r\n]+'
              replacement = (
                  r'\g<1>applicationId "'
                  + expected + '"'
              )

          else:
              raise SystemExit(
                  "ERROR: Android Gradle file not found"
              )

          content, count = re.subn(
              pattern,
              replacement,
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  f"ERROR: applicationId replacement count={count}"
              )

          path.write_text(content)

          manifest = root / "src/main/AndroidManifest.xml"

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          xml = manifest.read_text()

          xml, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="TQsignal V2"',
              xml,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Android app label not found"
              )

          manifest.write_text(xml)

          print("Gradle file:", path)
          print("Application ID:", expected)
          print("App name: TQsignal V2")
          PY

      - name: Install dependencies
        working-directory: app
        run: |
          flutter pub get

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file not found"
            exit 1
          fi

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -type f -name aapt | sort -V | tail -1)

          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt not found"
            exit 1
          fi

          INFO=$("$AAPT" dump badging "$APK")

          echo "$INFO" | head -1

          ACTUAL=$(echo "$INFO" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p" \
            | head -1)

          EXPECTED="com.jcapps.tqsignal.v2"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Wrong APK package ID"
            exit 1
          fi

          echo "APK package verification passed"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/app/outputs/flutter-apk/app-release.apk \
            TQsignal-V2-separate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TQsignal-V2-Separate-Install
          path: TQsignal-V2-separate.apk
          if-no-files-found: error
          retention-days: 30
